<?xml version="1.0" encoding="UTF-8"?>
<!--
  占位头像：纯 SVG，不依赖任何外部图片
  换成自己的照片：把 photos/avatar.jpg 放进images/ 目录，
  然后在 js/config.js 里把 avatar 改成 './images/avatar.jpg' 即可
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="占位头像">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="avatarFg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#avatarBg)" />

  <!-- 装饰圆环 -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />
  <circle cx="200" cy="200" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10" />

  <!-- 简约人物剪影 -->
  <circle cx="200" cy="163" r="54" fill="url(#avatarFg)" />
  <path d="M104 322c0-53 43-96 96-96s96 43 96 96z" fill="url(#avatarFg)" />
</svg>